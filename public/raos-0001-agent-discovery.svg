<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BACKGROUND                                              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect width="1200" height="700" fill="#f8fafc"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- HEADER  (y 0–95)                                        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect width="1200" height="95" fill="#0f172a"/>

  <!-- R logo -->
  <rect x="30" y="22" width="50" height="50" rx="10" fill="#10b981"/>
  <text x="55" y="55" text-anchor="middle" dominant-baseline="middle" font-size="26" font-weight="900" fill="#022c22">R</text>

  <!-- Wordmark -->
  <text x="90" y="52" dominant-baseline="middle" font-size="20" font-weight="700" fill="#ffffff">RetailAgent<tspan fill="#10b981">OS</tspan></text>

  <!-- Title + subtitle -->
  <text x="300" y="36" font-size="15" font-weight="700" fill="#f1f5f9">How RAOS-0001 gives AI agents merchant intelligence at catalog time</text>
  <text x="300" y="62" font-size="12" fill="#94a3b8">Reasoning moves from checkout-time to catalog-time. Agents get structured signals, not checkout walls.</text>
  <text x="300" y="80" font-size="12" fill="#64748b">com.os.retailagent.shopping.eligibility · Open Spec</text>

  <!-- RAOS badge -->
  <rect x="1010" y="22" width="165" height="52" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1092" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">RAOS-0001</text>
  <text x="1092" y="61" text-anchor="middle" font-size="10" fill="#fcd34d">Draft · Request for Comment</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- COMPARISON SECTION  (y 95–355)                          -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Left half bg (light red) -->
  <rect x="0" y="95" width="591" height="260" fill="#fff5f5"/>
  <!-- Right half bg (light green) -->
  <rect x="609" y="95" width="591" height="260" fill="#f0fdf4"/>
  <!-- Divider -->
  <rect x="591" y="95" width="18" height="260" fill="#e2e8f0"/>

  <!-- Section headers -->
  <text x="295" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626" letter-spacing="1">WITHOUT RAOS-0001</text>
  <text x="905" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">WITH RAOS-0001</text>

  <!-- ─── LEFT PIPELINE ─────────────────────────────────── -->
  <!-- Boxes centered at y=215, height=42 → top y=194 -->

  <!-- [AI Agent] -->
  <rect x="18" y="194" width="82" height="42" rx="7" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="59" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">AI Agent</text>

  <!-- → -->
  <line x1="100" y1="215" x2="126" y2="215" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- [Product Catalog] -->
  <rect x="126" y="188" width="105" height="54" rx="7" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="178" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Product Catalog</text>
  <text x="178" y="227" text-anchor="middle" font-size="9" fill="#94a3b8">all items identical</text>
  <text x="178" y="240" text-anchor="middle" font-size="9" fill="#94a3b8">no reasoning visible</text>

  <!-- → -->
  <line x1="231" y1="215" x2="255" y2="215" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- [Cart Built] -->
  <rect x="255" y="194" width="78" height="42" rx="7" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="294" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Cart Built</text>

  <!-- → (red arrow toward wall) -->
  <line x1="333" y1="215" x2="357" y2="215" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- [Checkout] -->
  <rect x="357" y="188" width="88" height="54" rx="7" fill="white" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="401" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Checkout</text>
  <text x="401" y="227" text-anchor="middle" font-size="9" fill="#dc2626">rules fire here</text>
  <text x="401" y="240" text-anchor="middle" font-size="9" fill="#dc2626">← too late</text>

  <!-- → -->
  <line x1="445" y1="215" x2="467" y2="215" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ❌ BLOCKED -->
  <rect x="467" y="188" width="105" height="54" rx="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="519" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="white">✗ BLOCKED</text>
  <text x="519" y="231" text-anchor="middle" font-size="10" fill="#fca5a5">Checkout wall</text>
  <text x="519" y="244" text-anchor="middle" font-size="10" fill="#fca5a5">Dead end</text>

  <!-- Note -->
  <text x="295" y="278" text-anchor="middle" font-size="11" fill="#64748b">Merchant rules are invisible until checkout.</text>
  <text x="295" y="295" text-anchor="middle" font-size="11" fill="#64748b">No guidance. No resolution path. Cart abandoned.</text>

  <!-- ─── RIGHT PIPELINE ────────────────────────────────── -->
  <!-- Agent box -->
  <rect x="620" y="194" width="82" height="42" rx="7" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="661" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">AI Agent</text>

  <!-- → green -->
  <line x1="702" y1="215" x2="730" y2="215" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- RAOS-0001 Evaluation box -->
  <rect x="730" y="148" width="225" height="144" rx="11" fill="white" stroke="#10b981" stroke-width="2.5"/>
  <!-- Header fill -->
  <rect x="730" y="148" width="225" height="35" rx="11" fill="#10b981"/>
  <rect x="730" y="168" width="225" height="15" fill="#10b981"/>
  <text x="842" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="white">RAOS-0001 Evaluation</text>

  <!-- Content inside -->
  <text x="748" y="202" font-size="10" font-weight="700" fill="#065f46">ComputedVisibility</text>
  <text x="748" y="217" font-size="10" fill="#374151">• VISIBLE → proceed to eligibility</text>
  <text x="748" y="231" font-size="10" fill="#374151">• HIDDEN → stop. Never surface.</text>

  <line x1="742" y1="240" x2="945" y2="240" stroke="#d1fae5" stroke-width="1"/>

  <text x="748" y="255" font-size="10" font-weight="700" fill="#065f46">ComputedEligibility</text>
  <text x="748" y="270" font-size="10" fill="#374151">• ELIGIBLE / CONDITIONAL / BLOCKED</text>
  <text x="748" y="284" font-size="10" fill="#374151">• Machine-readable reason codes</text>

  <!-- → -->
  <line x1="955" y1="215" x2="978" y2="215" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- [Cart] right -->
  <rect x="978" y="194" width="72" height="42" rx="7" fill="white" stroke="#10b981" stroke-width="1.5"/>
  <text x="1014" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Cart Built</text>

  <!-- → -->
  <line x1="1050" y1="215" x2="1073" y2="215" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ✓ circle -->
  <circle cx="1110" cy="215" r="30" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="1110" y="211" text-anchor="middle" font-size="20" font-weight="700" fill="white">✓</text>
  <text x="1110" y="228" text-anchor="middle" font-size="9" fill="#d1fae5">correct</text>

  <!-- Note right -->
  <text x="905" y="320" text-anchor="middle" font-size="11" fill="#064e3b" font-weight="600">Structured signals at catalog time.</text>
  <text x="905" y="337" text-anchor="middle" font-size="11" fill="#64748b">Agents explain blocks and guide buyers toward qualifying.</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- DIVIDER + CARD SECTION LABEL  (y 355–390)              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="0" y="355" width="1200" height="1" fill="#e2e8f0"/>
  <text x="600" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Three buyer scenarios — same product, different contexts, structured outcomes</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SCENARIO CARDS  (y 390–645)                             -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ─── CARD 1: HIDDEN / BLOCKED (red) ───────────────── -->
  <rect x="20" y="390" width="370" height="248" rx="12" fill="white" stroke="#fca5a5" stroke-width="2"/>
  <!-- Card header -->
  <rect x="20" y="390" width="370" height="46" rx="12" fill="#dc2626"/>
  <rect x="20" y="412" width="370" height="24" fill="#dc2626"/>
  <text x="205" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="white">HIDDEN → BLOCKED</text>

  <!-- Card body -->
  <text x="40" y="455" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">SCENARIO</text>
  <text x="40" y="472" font-size="11" fill="#374151">Wholesale-only SKU. Guest shopper.</text>

  <text x="40" y="498" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">VISIBILITY</text>
  <rect x="40" y="504" width="90" height="22" rx="5" fill="#fee2e2"/>
  <text x="85" y="519" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">HIDDEN</text>

  <text x="40" y="544" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">ELIGIBILITY CODE</text>
  <rect x="40" y="550" width="195" height="22" rx="5" fill="#fee2e2"/>
  <text x="137" y="565" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">BLOCKED · HIDDEN_PRODUCT</text>

  <text x="40" y="592" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">AGENT BEHAVIOR</text>
  <text x="40" y="608" font-size="11" fill="#475569">Item is never surfaced. No recommendation,</text>
  <text x="40" y="624" font-size="11" fill="#475569">no quote, no failed checkout attempt.</text>

  <!-- ─── CARD 2: CONDITIONAL (amber) ──────────────────── -->
  <rect x="415" y="390" width="370" height="248" rx="12" fill="white" stroke="#fcd34d" stroke-width="2"/>
  <!-- Card header -->
  <rect x="415" y="390" width="370" height="46" rx="12" fill="#d97706"/>
  <rect x="415" y="412" width="370" height="24" fill="#d97706"/>
  <text x="600" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="white">CONDITIONAL → Show the path</text>

  <!-- Card body -->
  <text x="435" y="455" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">SCENARIO</text>
  <text x="435" y="472" font-size="11" fill="#374151">Wholesale buyer. No resale cert on file.</text>

  <text x="435" y="498" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">VISIBILITY</text>
  <rect x="435" y="504" width="95" height="22" rx="5" fill="#d1fae5"/>
  <text x="482" y="519" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">VISIBLE</text>

  <text x="435" y="544" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">ELIGIBILITY CODE</text>
  <rect x="435" y="550" width="325" height="22" rx="5" fill="#fef3c7"/>
  <text x="597" y="565" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">CONDITIONAL · RESALE_CERTIFICATE_REQUIRED</text>

  <text x="435" y="592" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">AGENT SAYS</text>
  <text x="435" y="608" font-size="11" fill="#92400e" font-style="italic">"I can show this, but you'll need a resale</text>
  <text x="435" y="624" font-size="11" fill="#92400e" font-style="italic">certificate on file. Want to upload one?"</text>

  <!-- ─── CARD 3: ELIGIBLE (green) ─────────────────────── -->
  <rect x="810" y="390" width="370" height="248" rx="12" fill="white" stroke="#6ee7b7" stroke-width="2"/>
  <!-- Card header -->
  <rect x="810" y="390" width="370" height="46" rx="12" fill="#059669"/>
  <rect x="810" y="412" width="370" height="24" fill="#059669"/>
  <text x="995" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="white">ELIGIBLE → Proceed freely</text>

  <!-- Card body -->
  <text x="830" y="455" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">SCENARIO</text>
  <text x="830" y="472" font-size="11" fill="#374151">Wholesale buyer. Resale cert on file.</text>

  <text x="830" y="498" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">VISIBILITY</text>
  <rect x="830" y="504" width="95" height="22" rx="5" fill="#d1fae5"/>
  <text x="877" y="519" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">VISIBLE</text>

  <text x="830" y="544" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">ELIGIBILITY CODE</text>
  <rect x="830" y="550" width="110" height="22" rx="5" fill="#d1fae5"/>
  <text x="885" y="565" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">ELIGIBLE</text>

  <text x="830" y="592" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">AGENT BEHAVIOR</text>
  <text x="830" y="608" font-size="11" fill="#475569">Clean signal. No reason codes. Agent</text>
  <text x="830" y="624" font-size="11" fill="#475569">recommends and adds to cart freely.</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FOOTER  (y 648–700)                                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="0" y="648" width="1200" height="52" fill="#0f172a"/>
  <text x="30" y="678" font-size="11" fill="#94a3b8">RetailAgentOS · RAOS-0001 · Eligibility &amp; Visibility Semantics · Open Spec</text>
  <text x="1170" y="678" text-anchor="end" font-size="11" fill="#475569">retailagentos.com/specs/0001-eligibility</text>

</svg>
